http_port 3128

acl worker_net src 172.30.0.0/24
acl connect_method method CONNECT
acl allowed_ports port 80 443
acl tls_ports port 443

acl blocked_ipv4 dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.88.99.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4

acl blocked_ipv6 dst \
    ::/128 \
    ::1/128 \
    64:ff9b::/96 \
    64:ff9b:1::/48 \
    2001::/32 \
    2001:db8::/32 \
    2002::/16 \
    fc00::/7 \
    fe80::/10 \
    ff00::/8

http_access deny !allowed_ports
http_access deny connect_method !tls_ports
http_access deny blocked_ipv4
http_access deny blocked_ipv6
http_access allow worker_net
http_access deny all

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
forwarded_for delete
via off
request_header_access Authorization deny all
request_header_access Proxy-Authorization deny all
request_header_access Cookie deny all
request_header_access Referer deny all

access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
coredump_dir /tmp
pinger_enable off
