<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PhishGuard - Analizando sitio...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 500px;
      width: 90%;
    }
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo-icon {
      background-color: #0d6efd;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 10px;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
    }
    .spinner {
      margin: 30px auto;
      width: 50px;
      height: 50px;
      border: 5px solid #e9ecef;
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 14px;
      color: #6c757d;
      line-height: 1.5;
    }
    .target-url {
      margin-top: 15px;
      font-size: 13px;
      color: #0d6efd;
      background: #f1f8ff;
      padding: 8px 12px;
      border-radius: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo-icon">✓</div>
      <div class="logo-text">PhishGuard</div>
    </div>
    <div class="spinner"></div>
    <div class="title">Analizando seguridad con Inteligencia Artificial...</div>
    <div class="subtitle">Por tu seguridad, estamos evaluando la estructura de este sitio antes de dejarte entrar. Esto tomará unos segundos.</div>
    <div class="target-url" id="target-url">Cargando enlace...</div>
  </div>
  <script src="analyzing.js"></script>
</body>
</html>
